name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          flutter create . --project-name studio_recorder --platforms android --org com.example
          cp /tmp/main.dart.bak lib/main.dart
          flutter pub add flutter_sound permission_handler path_provider
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: studio-recorder-apk
          path: build/app/outputs/flutter-apk/app-release.apk
