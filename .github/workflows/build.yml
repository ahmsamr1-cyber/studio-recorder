name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Build
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          flutter create . --project-name studio_recorder --platforms android --org com.example --no-pub
          cp /tmp/main.dart.bak lib/main.dart
          # رفع نسخة الأندرويد المطلوبة
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          sed -i 's/minSdkVersion.*/minSdkVersion 21/' android/app/build.gradle || true
          sed -i 's/minSdk .*/minSdk 21/' android/app/build.gradle || true
          flutter pub add record permission_handler path_provider --no-pre
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: studio-recorder-apk
          path: build/app/outputs/flutter-apk/app-release.apk
